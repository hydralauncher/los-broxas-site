<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Los Broxas</title>
  <meta name="description" content="Los Broxas — the team behind Hydra Launcher.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://losbroxas.org/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Los Broxas">
  <meta property="og:title" content="Los Broxas">
  <meta property="og:description" content="The team behind Hydra Launcher.">
  <meta property="og:url" content="https://losbroxas.org/">
  <meta property="og:image" content="https://losbroxas.org/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Los Broxas">
  <meta name="twitter:description" content="The team behind Hydra Launcher.">
  <meta name="twitter:image" content="https://losbroxas.org/og.png">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="logo.svg" as="image" type="image/svg+xml" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Los Broxas",
    "url": "https://losbroxas.org/",
    "logo": "https://losbroxas.org/logo.svg",
    "email": "contact@losbroxas.org",
    "sameAs": ["https://github.com/hydralauncher", "https://hydralauncher.gg"]
  }
  </script>
</head>
<body>
  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <img class="layer layer--echo layer--echo-3" src="logo.svg" alt="" aria-hidden="true" draggable="false" width="363" height="366" decoding="async">
      <img class="layer layer--echo layer--echo-2" src="logo.svg" alt="" aria-hidden="true" draggable="false" width="363" height="366" decoding="async">
      <img class="layer layer--echo layer--echo-1" src="logo.svg" alt="" aria-hidden="true" draggable="false" width="363" height="366" decoding="async">
      <img class="layer layer--logo" src="logo.svg" alt="Los Broxas" draggable="false" width="363" height="366" fetchpriority="high">
    </div>

    <div class="pill" id="pill">
      <span class="pill__name">Los Broxas</span>
      <span class="pill__mark">©</span>
    </div>

    <p class="tagline">The team behind <a href="https://hydralauncher.gg" target="_blank" rel="noopener">Hydra Launcher</a></p>
  </main>

  <footer class="foot">
    <a href="https://github.com/hydralauncher" target="_blank" rel="noopener">GitHub</a>
    <span class="foot__dot" aria-hidden="true"></span>
    <a href="https://hydralauncher.gg" target="_blank" rel="noopener">hydralauncher.gg</a>
    <span class="foot__dot" aria-hidden="true"></span>
    <a href="mailto:contact@losbroxas.org">contact@losbroxas.org</a>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
